<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .countdown-circle {
      stroke-dasharray: 283;
      stroke-dashoffset: 70;
      transition: stroke-dashoffset 1s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>

<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-space-md sm:p-space-lg selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Underlying Subtle App Context (Dimmed backdrop simulation) -->
<div aria-hidden="true" class="fixed inset-0 bg-primary/20 backdrop-blur-md transition-opacity duration-300 z-10"></div>
<!-- Safety Check-In Modal Canvas -->
<main class="relative z-20 w-full max-w-[440px] bg-surface-container-lowest rounded-[28px] border border-outline-variant/40 shadow-2xl p-space-lg sm:p-space-xl flex flex-col items-center text-center overflow-hidden">
<!-- Botanical Ambient Calm Accents -->
<div class="absolute -top-16 -right-16 w-36 h-36 bg-primary-fixed/30 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-16 -left-16 w-36 h-36 bg-tertiary-fixed/30 rounded-full blur-2xl pointer-events-none"></div>
<!-- Soft Garden City Safe Anchor Badge -->
<div class="mb-space-md inline-flex items-center gap-space-xs px-3.5 py-1.5 rounded-full bg-surface-container-low border border-outline-variant/30 text-primary">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-md text-label-md text-primary font-semibold tracking-wide">Raksha&nbsp; Bengaluru Active Safe Check</span>
</div>
<!-- Title & Gentle Comforting Subtext -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight mb-space-xs">
      Safety Check
    </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[300px] mb-space-lg">
      Checking in on you, Elena. Are you okay?
    </p>
<!-- Calming Countdown Timer Ring -->
<div class="relative w-40 h-40 flex items-center justify-center mb-space-lg">
<svg class="w-full h-full" viewBox="0 0 100 100">
<!-- Background Track -->
<circle class="stroke-surface-container" cx="50" cy="50" fill="transparent" r="45" stroke-width="5"></circle>
<!-- Progress Ring (Forest Green Calm) -->
<circle class="countdown-circle stroke-primary-container" cx="50" cy="50" fill="transparent" id="timer-ring" r="45" stroke-linecap="round" stroke-width="5.5" style="stroke-dasharray: 282.743; stroke-dashoffset: 282.743;"></circle>
</svg>
<!-- Inner Countdown Visual -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-display-lg text-display-lg font-bold text-primary tracking-tight leading-none" id="countdown-val">0</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline mt-1">
          seconds left
        </span>
</div>
</div>
<!-- Actions Container -->
<div class="w-full flex flex-col gap-space-sm">
<!-- Primary Action: "I am Safe" (High-clarity, comforting tap) -->
<button aria-label="Confirm safety and dismiss check" class="w-full min-h-[58px] bg-primary-container text-on-primary rounded-full px-space-lg py-3 flex items-center justify-center gap-space-xs shadow-md hover:bg-primary active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-4 focus:ring-primary-fixed" id="dismiss-btn" type="button">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-lg text-label-lg tracking-wide font-bold">✓ I am Safe</span>
</button>
<!-- Extender Action Link -->
<button class="w-full py-2.5 px-space-md text-primary font-label-md text-label-md hover:bg-surface-container-low rounded-full transition-colors inline-flex items-center justify-center gap-1.5 focus:outline-none" id="extend-btn" type="button">
<span class="material-symbols-outlined text-[18px]">more_time</span>
<span class="">+ Add 15 mins to walk</span>
</button>
<!-- Secondary Action: "Need Help (Alert 112)" -->
<button class="w-full min-h-[52px] bg-surface-container-lowest text-secondary border-2 border-secondary/40 hover:border-secondary hover:bg-secondary-fixed/20 rounded-full px-space-lg py-2.5 flex items-center justify-center gap-space-xs transition-all duration-150 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-secondary" id="sos-btn" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="font-label-md text-label-md font-bold tracking-wide">Need Help (Alert 112)</span>
</button>
</div>
<!-- Discreet Reassurance Bottom Note -->
<div class="mt-space-lg pt-space-sm border-t border-surface-container w-full flex items-center justify-center gap-1.5 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">local_police</span>
<p class="font-body-sm text-body-sm text-outline">
        Auto-alerts Bengaluru Police 112 if unanswered.
      </p>
</div>
</main>
<script>
    // Smooth countdown logic for demonstration
    let timeLeft = 15;
    const totalTime = 15;
    const countdownEl = document.getElementById('countdown-val');
    const ring = document.getElementById('timer-ring');
    const circumference = 2 * Math.PI * 45; // ~282.74

    ring.style.strokeDasharray = `${circumference}`;
    ring.style.strokeDashoffset = '0';

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(timer);
        countdownEl.textContent = '0';
        ring.style.strokeDashoffset = `${circumference}`;
      } else {
        countdownEl.textContent = timeLeft;
        const offset = circumference - (timeLeft / totalTime) * circumference;
        ring.style.strokeDashoffset = offset;
      }
    }, 1000);

    // Interactive button dismissal feedback
    const dismissBtn = document.getElementById('dismiss-btn');
    dismissBtn.addEventListener('click', () => {
      clearInterval(timer);
      dismissBtn.innerHTML = '<span class="material-symbols-outlined text-[24px]">verified</span><span class="font-label-lg text-label-lg font-bold">Checked In • Safe</span>';
      dismissBtn.classList.remove('bg-primary-container');
      dismissBtn.classList.add('bg-primary');
    });

    const extendBtn = document.getElementById('extend-btn');
    extendBtn.addEventListener('click', () => {
      timeLeft = 15;
      countdownEl.textContent = '15';
      ring.style.strokeDashoffset = '0';
      extendBtn.textContent = '✓ Added 15 minutes';
      setTimeout(() => {
        extendBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">more_time</span><span>+ Add 15 mins to walk</span>';
      }, 2000);
    });
  </script>


</body></html>
